# Builds Sawbuck using the normal GYP/MSVC flow -- the same build.bat anyone
# would run locally, rather than a reimplementation of it in YAML. If this
# passes and a local build does not, the difference is the machine.
#
# No separate XP build to make: build.bat links winwrap by default, so one
# binary covers XP through 11, and the WiX 3 installer runs on XP as well
# (InstallerVersion 200, and a launch condition of 5.01 rather than anything
# newer). The artifacts are therefore just Sawbuck_x86.msi and Sawbuck_x64.msi.
#
# Manual only. There is no push or pull_request trigger on purpose: this syncs
# Chromium's M49 base, ICU and the rest, then builds Release for two
# architectures, which is tens of minutes of runner time for a tree that does
# not change that often.
#
# One job, with the sync and the two architectures as three steps. Not three
# jobs: separate jobs do not share a workspace, so each would re-sync the
# dependencies, which costs more than the builds it would overlap. Three steps
# in one job gets the thing that was actually wanted -- a failure that names
# where it happened -- for nothing.
#
# What it proves, in order:
#
#   1. gclient sync works against the pinned DEPS -- which is the part most
#      likely to rot without anyone touching this repository, since every
#      revision is pinned in someone else's infrastructure.
#   2. The tree builds with plain VS2022 against the current Windows SDK.
#   3. No function winwrap covers is bound to a system DLL, and the subsystem
#      floor is low enough for XP. Worth a step of its own because linking
#      winwrap and using it are different things, and when it goes wrong
#      nothing says so: the binary links, it runs on the runner, and it fails
#      at load on the one OS nobody here is testing on.
#
#      Note what that does *not* prove. check_imports.py reads the covered
#      list out of winwrap's own sources and checks only those names, so an
#      import of some post-XP function winwrap has no shim for has nothing to
#      compare against and passes silently. A green step here means "winwrap
#      won the link", not "this binary has no post-XP imports". Reach for
#      --show-all, which lists every import and marks the covered ones, when
#      a binary that passes this still will not start.
#   4. Both installers exist and are uploaded.

name: Build Sawbuck-ng

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Windows SDK this build is expected to use, checked before building
  # rather than pinned in the build files -- nothing in the tree names an SDK,
  # so a local build keeps using whatever the machine has.
  WINDOWS_SDK: 10.0.26100.0

jobs:
  build:
    name: GYP Build
    # Pinned rather than windows-latest, which has moved to 2025 and will move
    # again. Visual Studio 2022 is what this tree is known to build with, and
    # what build.bat falls back to naming.
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record the revision
        id: rev
        shell: cmd
        run: |
          rem Redirection first, deliberately. `echo short=%%i>> file` breaks
          rem when the hash ends in a digit: cmd reads the trailing digit as a
          rem stream number, so `...a1>> file` redirects stream 1 and writes
          rem "short=a".
          for /f %%i in ('git rev-parse --short HEAD') do >>%GITHUB_OUTPUT% echo short=%%i

      # gclient, which build.bat requires on PATH and which also supplies the
      # python3 the DEPS hooks invoke. Appended rather than prepended so
      # depot_tools' bundled interpreter does not shadow the runner's tools;
      # gclient.bat calls its own python explicitly, so being later on PATH
      # costs nothing.
      #
      # DEPOT_TOOLS_WIN_TOOLCHAIN=0 is not optional. Without it depot_tools
      # tries to fetch Google's internal packaged toolchain, which is not
      # available outside their network, and the failure is some way removed
      # from the cause.
      - name: Install depot_tools
        shell: cmd
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "%RUNNER_TEMP%\depot_tools" || exit /b 1
          >>%GITHUB_PATH% echo %RUNNER_TEMP%\depot_tools
          >>%GITHUB_ENV% echo DEPOT_TOOLS_WIN_TOOLCHAIN=0

      - name: Check the tools are visible
        shell: cmd
        run: |
          where gclient || exit /b 1
          python --version || exit /b 1

      # What is available. Filtered to 10.*, because Include\ also holds a
      # 'wdf' directory -- which is worth saying since it is what broke the
      # first version of this step: it sorted the names descending to guess
      # which one GYP would take, and 'wdf' sorts above every digit.
      #
      # No guess here now. GYP does not simply take the newest: it reads
      # ProductVersion from the SDK's registry key, keeps only the include
      # directories whose names start with it, and takes the newest of those --
      # so a registry entry naming an older product version wins over a newer
      # SDK sitting right beside it. Predicting that from a shell means
      # reimplementing it, and a reimplementation can be wrong in ways that
      # look right. The build is asked what it actually used instead, below.
      - name: Show installed Windows SDKs
        shell: cmd
        run: |
          set "KITS=%ProgramFiles(x86)%\Windows Kits\10\Include"
          echo Installed SDKs:
          dir /b /o-n "%KITS%\10.*" || exit /b 1
          echo.
          echo Expecting the build to use %WINDOWS_SDK%
          if exist "%KITS%\%WINDOWS_SDK%\um\windows.h" exit /b 0
          echo ERROR: Windows SDK %WINDOWS_SDK% is not installed on this runner.
          echo        Update WINDOWS_SDK in this workflow to one of the above.
          exit /b 1

      # The build, split across three steps rather than one call to build.bat,
      # so the log says which part failed without anyone reading into it. The
      # sync is the slowest and the most likely to break on its own -- every
      # revision is pinned in someone else's infrastructure -- and the two
      # architectures fail for unrelated reasons when they fail at all. A
      # single step reported all of that as "Build".
      #
      # Still build.bat in each one, not msbuild invoked from YAML: the point
      # of this workflow is that it runs what a person runs. --sync-only and
      # --arch exist for this, and are equally useful locally.
      #
      # The sync has to come first and alone, because it is what generates the
      # solution the other two build. --no-sync on both of those is therefore
      # load-bearing and not an optimisation: without it each would re-sync,
      # and --reset would revert patches/ underneath a finished build.
      #
      # Sequential, not a matrix. A matrix would want a job per architecture,
      # and a job per architecture means syncing Chromium's base, ICU and the
      # rest twice -- which costs more runner time than the two builds it
      # overlaps, and doubles the exposure to the one step most likely to be
      # flaky. The installers also have to end up in one artifact.
      #
      # No --jobs: the runner has few enough cores that bare /m is right.
      - name: Sync dependencies and generate the solution
        shell: cmd
        run: build.bat --sync-only

      # Which SDK the build will use, asked of the generated project rather
      # than predicted. GYP writes its choice into every project as
      # WindowsTargetPlatformVersion, and MSBuild resolves the SDK and the ATL
      # paths from that one property, so this is the answer and not a proxy
      # for it.
      #
      # Before the builds and after the generation, which is only possible
      # because those are now separate steps. It used to run after everything,
      # since generation happened inside the single build step -- so a
      # mismatch was found having already paid for both builds. That was the
      # stated price of not reimplementing GYP's registry-driven SDK selection
      # in this file, and splitting the steps refunds it.
      - name: Check which Windows SDK the build will use
        shell: cmd
        run: |
          set "PROJ=sawbuck\viewer\sawbuck_exe.vcxproj"
          if not exist "%PROJ%" (
            echo ERROR: %PROJ% is missing, so the solution did not generate.
            exit /b 1
          )
          findstr /c:"WindowsTargetPlatformVersion" "%PROJ%"
          findstr /c:"<WindowsTargetPlatformVersion>%WINDOWS_SDK%<" "%PROJ%" >nul && exit /b 0
          echo.
          echo ERROR: the build would not use %WINDOWS_SDK%; see the line above.
          echo        GYP picks the SDK from the registry's ProductVersion, not
          echo        from whichever is newest, so a runner image change can
          echo        move it. Update WINDOWS_SDK in this workflow to match.
          exit /b 1

      - name: Build x86
        shell: cmd
        run: build.bat --no-sync --arch x86

      - name: Build x64
        shell: cmd
        run: build.bat --no-sync --arch x64

      - name: Show what was built
        shell: cmd
        run: dir /s /b out\Release_x86\*.exe out\Release_x86\*.msi out\Release_x64\*.exe out\Release_x64\*.msi

      # Step 3. The subsystem floor differs by architecture: 5.01 is XP on x86,
      # and 64-bit Windows begins at 5.02, which is as low as the linker goes
      # for that machine.
      #
      # check_imports.py reads the covered-function list out of winwrap's own
      # sources, so it cannot disagree with the library that was linked -- and
      # equally, cannot see past it. These steps are named for what they check
      # rather than for what anyone wants to conclude: a pass says winwrap won
      # the link and the header claims a version XP will accept, which is
      # necessary for running there and not sufficient. See the note at the top.
      - name: Check x86 imports and subsystem floor
        run: |
          python third_party/winwrap/tools/check_imports.py --min-os 5.01 `
            out/Release_x86/Sawbuck.exe

      - name: Check x64 imports and subsystem floor
        run: |
          python third_party/winwrap/tools/check_imports.py --min-os 5.02 `
            out/Release_x64/Sawbuck.exe

      # Staged into one flat directory so the artifact holds the two installers
      # side by side rather than nested under out\Release_<arch>\. Note that
      # GitHub zips every artifact, so this downloads as a .zip containing two
      # .msi files -- which is a property of the upload and not a return of the
      # old per-architecture .zip packaging.
      - name: Stage the installers
        shell: cmd
        run: |
          mkdir installers || exit /b 1
          copy /Y out\Release_x86\Sawbuck_x86.msi installers\ || exit /b 1
          copy /Y out\Release_x64\Sawbuck_x64.msi installers\ || exit /b 1
          dir /b installers

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sawbuck-${{ steps.rev.outputs.short }}
          path: installers/*.msi
          if-no-files-found: error
